<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roteador AC1200 · Archer C6</title>
<style>
:root{--bg:#07090d;--fg:#eef3f8;--mut:#9fb0c2;--c5:#37c8ff;--c24:#ffa640;--ok:#4ade80;--no:#f87171;--warn:#facc15;--font:"Inter","Segoe UI Variable","Segoe UI",system-ui,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;cursor:default}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.65))}
#chapter{position:fixed;top:3.2vh;left:3.5vw;font-size:clamp(14px,1.05vw,20px);letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
#chapter span{color:var(--c5);margin-right:.6em}
#brand{position:fixed;top:3.2vh;right:3.5vw;font-size:clamp(13px,.95vw,18px);color:var(--mut);letter-spacing:.1em}
#progress{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--c24),var(--c5));transition:width .8s cubic-bezier(.6,0,.2,1)}
#labels{position:fixed;inset:0;pointer-events:none}
.tag,.nlabel{position:absolute;left:0;top:0;white-space:nowrap;transition:opacity .4s;font-weight:600}
.tag{padding:.45em .9em;border-radius:999px;background:rgba(8,14,22,.82);border:1px solid rgba(55,200,255,.55);font-size:clamp(14px,1.1vw,22px);box-shadow:0 0 24px rgba(55,200,255,.25);opacity:0}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:22px;background:linear-gradient(rgba(55,200,255,.8),transparent)}
.nlabel{font-size:clamp(14px,1.15vw,23px);color:var(--mut);background:rgba(8,14,22,.7);padding:.2em .6em;border-radius:6px}
.ov{position:fixed;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1);pointer-events:none;max-width:38vw}
.ov.show{opacity:1;transform:none}
.ov.left{left:5vw;top:50%;margin-top:-22vh}
.ov.right{right:5vw;top:50%;margin-top:-24vh;max-width:40vw}
.ov.top{left:50%;top:9vh;margin-left:-32vw;max-width:64vw;text-align:center}
.ov.center{left:50%;top:9vh;margin-left:-35vw;max-width:70vw;width:70vw;text-align:center}
.ov.center-bottom{left:50%;bottom:7vh;margin-left:-38vw;width:76vw;max-width:76vw}
.ov.full{display:none}
.ov.show *{pointer-events:auto}
.kicker{font-size:clamp(13px,1vw,19px);letter-spacing:.22em;text-transform:uppercase;color:var(--c5);font-weight:700;margin-bottom:1.2vh}
h1.hero{font-size:clamp(44px,5.4vw,110px);font-weight:700;letter-spacing:-.03em;line-height:1;background:linear-gradient(180deg,#fff,#9fb0c2);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:clamp(18px,1.6vw,30px);color:var(--mut);margin-top:2vh}
h2{font-size:clamp(30px,2.9vw,58px);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-bottom:2.2vh}
p{font-size:clamp(17px,1.45vw,28px);line-height:1.45;color:#d5dee8;margin-bottom:1.4vh}
small{font-size:.7em;color:var(--mut)}
.note{font-size:clamp(14px,1.05vw,20px);color:var(--mut)}
.warn{border-left:3px solid var(--warn);padding-left:1em}
ul.big,ol.steps{list-style:none;display:grid;gap:1.4vh}
ul.big li,ol.steps li{font-size:clamp(17px,1.45vw,28px);line-height:1.35;padding-left:1.2em;position:relative;color:#d5dee8}
ul.big li::before{content:"";position:absolute;left:0;top:.55em;width:.45em;height:.45em;border-radius:50%;background:var(--c5)}
ol.steps{counter-reset:s}
ol.steps li{counter-increment:s;padding-left:1.8em}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:.1em;width:1.3em;height:1.3em;border-radius:50%;background:rgba(55,200,255,.15);color:var(--c5);font-size:.8em;display:grid;place-items:center;font-weight:700}
dl.spec{display:grid;grid-template-columns:auto 1fr;gap:1.6vh 2vw}
dl.spec dt{font-size:clamp(14px,1.05vw,20px);color:var(--mut);text-transform:uppercase;letter-spacing:.12em;padding-top:.35em}
dl.spec dd{font-size:clamp(18px,1.6vw,30px);font-weight:600}
.bands{display:flex;gap:1.5vw;margin-bottom:2vh}
.bands>div{flex:1;padding:2vh 1.4vw;border-radius:14px;background:rgba(255,255,255,.04);display:grid;gap:.5vh}
.bands b{font-size:clamp(26px,2.4vw,46px)}
.bands span{color:var(--mut);font-size:clamp(14px,1.1vw,21px)}
.bands em{font-style:normal;font-size:clamp(18px,1.5vw,28px);font-weight:600}
.b24{border:1px solid rgba(255,166,64,.5)}.b24 b{color:var(--c24)}
.b5{border:1px solid rgba(55,200,255,.5)}.b5 b{color:var(--c5)}
.sum{font-size:clamp(34px,3.6vw,72px);font-weight:700;margin:1vh 0 3vh}
.sum .o{color:var(--c24)}.sum .c{color:var(--c5)}
.pill{font-size:.42em;vertical-align:middle;padding:.3em .8em;border-radius:999px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-left:.4em}
.pill.blue{background:#0a3a66;color:#9fd7ff}.pill.amber{background:#5a4206;color:#ffd37a}
.pill.ok{background:rgba(74,222,128,.15);color:var(--ok)}.pill.no{background:rgba(248,113,113,.15);color:var(--no)}.pill.warn{background:rgba(250,204,21,.15);color:var(--warn)}
.url{font-family:ui-monospace,Consolas,monospace;font-size:clamp(28px,2.6vw,52px);font-weight:700;color:var(--c5);margin-bottom:.6vh}
.url span{color:var(--mut);font-weight:400}
.url.alt{font-size:clamp(22px,1.9vw,38px);color:#fff;margin-bottom:2.6vh}
.photo{width:min(30vw,560px);aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:#fff;display:grid;place-items:center;margin-bottom:1.6vh}
.photo img{display:block;width:100%;height:100%;object-fit:contain;padding:1vh}
.photo{display:block;position:relative}
.photo span{display:none;color:#456;text-align:center;font-size:clamp(14px,1.1vw,20px);padding:2vw}
.photo.missing{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.25)}
.photo.missing img{display:none}.photo.missing span{display:block;color:var(--mut)}
table.cmp{width:100%;border-collapse:collapse;background:rgba(8,12,18,.82);border-radius:16px;overflow:hidden;backdrop-filter:blur(8px)}
table.cmp th,table.cmp td{padding:1.3vh 1.4vw;text-align:left;font-size:clamp(15px,1.25vw,24px);border-bottom:1px solid rgba(255,255,255,.07)}
table.cmp th{color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(13px,1vw,19px)}
table.cmp th:nth-child(2){color:var(--c5)}
table.cmp td:first-child{color:var(--mut)}
ul.src{list-style:none;display:grid;gap:1.6vh;text-align:left;margin:0 auto;max-width:56vw}
ul.src li{display:grid;gap:.3vh;padding:1.2vh 1.2vw;border-radius:12px;background:rgba(255,255,255,.04)}
ul.src b{font-size:clamp(16px,1.35vw,26px)}
ul.src span{font-family:ui-monospace,Consolas,monospace;color:var(--c5);font-size:clamp(13px,1.05vw,20px)}
#panel{position:fixed;right:4vw;top:12vh;width:56vw;opacity:0;transform:translateX(40px) scale(.98);transition:all .9s cubic-bezier(.2,.7,.2,1);pointer-events:none}
#panel.show{opacity:1;transform:none}
.tabs{display:flex;gap:.6vw;margin-bottom:2vh}
.tabs .t{padding:.6em 1.2em;border-radius:10px;background:rgba(255,255,255,.05);color:var(--mut);font-size:clamp(14px,1.05vw,20px)}
.tabs .t.active{background:rgba(55,200,255,.15);color:var(--c5)}
.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2vw;margin-bottom:2vh}
figure{display:grid;gap:1.2vh}
.mock{background:#f4f6f8;color:#1b2430;border-radius:12px;padding:1.6vh 1.1vw;min-height:24vh;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mock h5{font-size:clamp(14px,1.15vw,22px);margin-bottom:1.4vh;color:#0b6e8a;border-bottom:2px solid #4acbd6;padding-bottom:.6vh}
.mock .row{display:flex;justify-content:space-between;font-size:clamp(13px,1vw,19px);padding:.9vh 0;border-bottom:1px solid #e1e6ea}
.mock i{font-style:normal;font-weight:600}.mock .okc{color:#16a34a}
figcaption{font-size:clamp(14px,1.05vw,20px);color:#d5dee8;line-height:1.35}
#info{position:fixed;width:360px;padding:16px 18px;border-radius:14px;background:rgba(8,14,22,.92);border:1px solid rgba(55,200,255,.4);opacity:0;transition:opacity .3s;pointer-events:none}
#info.show{opacity:1}
#info b{font-size:20px;color:var(--c5)}#info p{font-size:17px;margin:8px 0 0}
#legend{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1.2vh;padding:1.4vh 1.8vw;border-radius:14px;background:rgba(8,14,22,.82);border:1px solid rgba(255,255,255,.08);font-size:clamp(14px,1.05vw,21px);color:#d5dee8;opacity:0;transition:opacity .5s;pointer-events:none}#legend.show{opacity:1}#legend .row{display:flex;gap:2vw;align-items:center;white-space:nowrap}#legend i{display:inline-block;width:2.6em;height:0;border-top:3px solid;vertical-align:middle;margin-right:.6em}#legend i.d{border-top-style:dashed}#legend .flow{color:#fff;font-weight:600}#legend .flow b{color:var(--c5)}
.nlabel.main{color:#001018;background:var(--c5);font-weight:700}
#help{position:fixed;bottom:2.2vh;right:3.5vw;font-size:13px;color:rgba(159,176,194,.45)}
#fallback{display:none}
body.nowebgl #fallback{display:block;position:fixed;bottom:6vh;left:5vw;color:var(--mut);font-size:16px}
body.nowebgl .ov.right,body.nowebgl .ov.left{max-width:80vw}
</style>
<style id="pcss">
body{background:#0b0e13;color:#e8eef5;font-family:"Segoe UI",system-ui,Arial,sans-serif;margin:0;padding:20px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box;gap:14px}
header{display:flex;justify-content:space-between;align-items:center;font-size:20px}
header em{color:#9fb0c2;font-style:normal;margin-left:10px}
.who{background:#37c8ff;color:#001018;padding:3px 12px;border-radius:999px;font-weight:700;margin-left:10px}
.dur{color:#ffa640;margin-left:10px}
#ptime{display:flex;gap:10px;align-items:center}
#clock{font-family:Consolas,monospace;font-size:34px;font-weight:700}
button{background:#1c2430;color:#e8eef5;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
#pbar{height:6px;background:#1c2430;border-radius:3px;overflow:hidden}
#pbar i{display:block;height:100%;background:linear-gradient(90deg,#ffa640,#37c8ff)}
main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:20px;min-height:0}
#pscript{background:#121821;border-radius:14px;padding:26px;overflow:auto}
.step{font-size:28px;line-height:1.5}
.cue{margin-top:22px;color:#ffa640;font-size:18px}
aside{background:#121821;border-radius:14px;padding:20px;overflow:auto;font-size:18px;line-height:1.4}
aside h4{color:#37c8ff;text-transform:uppercase;letter-spacing:.12em;font-size:13px;margin:16px 0 6px}
aside h4:first-child{margin-top:0}
.keys{margin-top:24px;color:#6b7c8f;font-size:14px}
</style>
</head>

tante: \u201CAC1200\u201D n\xE3o \xE9 o nome de um aparelho, \xE9 uma classe de velocidade. V\xE1rios fabricantes vendem roteadores AC1200.",cue:"Avance para o roteador \u201Cacender\u201D."},{name:"Roteador acende",layout:"center",view:{cam:[0,2.4,10],target:[0,.8,0]},dur:3.2,html:'<div class="kicker">Por isso escolhemos um modelo real</div><h1 class="hero">TP-Link Archer C6</h1>',say:"Por isso escolhemos um modelo espec\xEDfico e real: o TP-Link Archer C6. Ele \xE9 bastante vendido no Brasil e o fabricante publica toda a documenta\xE7\xE3o, o que permite apresentar dados confi\xE1veis.",cue:"Espere a c\xE2mera parar e avance."}]},{title:"Identifica\xE7\xE3o",who:Pc,time:"1:20",view:{cam:[5,3,9],target:[-1.2,.8,0],ry:-.35,x:-1.4},steps:[{name:"Ficha de identifica\xE7\xE3o",layout:"right",html:`<div class="kicker">01 \xB7 Identifica\xE7\xE3o</div><h2>Quem \xE9 este roteador</h2>
        <dl class="spec">
          <dt>Fabricante</dt><dd>TP-Link</dd>
          <dt>Modelo</dt><dd>Archer C6 \xB7 AC1200 Wireless MU-MIMO Gigabit Router</dd>
          <dt>Vers\xE3o de hardware</dt><dd>V3 <small>(indicada na etiqueta inferior: \u201CVer: 3.x\u201D)</small></dd>
          <dt>Tamanho</dt><dd>\u2248 23 cm de largura \xD7 3,5 cm de altura</dd>
        </dl>`,say:"Fabricante: TP-Link. Modelo: Archer C6, que a pr\xF3pria TP-Link chama de \u201CAC1200 Wireless MU-MIMO Gigabit Router\u201D. A vers\xE3o de hardware que estudamos \xE9 a V3. A vers\xE3o importa porque o fabricante \xE0s vezes muda componentes entre vers\xF5es, e o manual certo depende dela. Ela aparece na etiqueta embaixo do aparelho.",notes:"Se perguntarem: a vers\xE3o fica na etiqueta inferior, ao lado do n\xFAmero de s\xE9rie, no formato \u201CVer: 3.20\u201D, por exemplo."},{name:"Foto oficial",layout:"right",view:{cam:[0,7.5,4.5],target:[-1.4,.4,0],ry:0},html:`<div class="kicker">01 \xB7 Identifica\xE7\xE3o</div><h2>Foto oficial</h2>
        <div class="photo"><img src="assets/archer-c6.png" onerror="this.parentNode.classList.add('missing')" alt="Foto oficial Archer C6"><span>Coloque a foto oficial em <code>assets/archer-c6.png</code><br>(p\xE1gina do produto: tp-link.com/br)</span></div>
        <p class="note">Modelo 3D ao lado \xE9 uma recria\xE7\xE3o para fins did\xE1ticos.</p>`,say:"Aqui est\xE1 a foto oficial do produto, da p\xE1gina da TP-Link. E ao lado, o modelo 3D que vamos usar durante toda a apresenta\xE7\xE3o para mostrar cada parte do roteador."}]},{title:"Caracter\xEDsticas t\xE9cnicas",who:Pc,time:"2:00",view:{cam:[0,3.2,9.5],target:[0,1.6,0],antGlow:1},steps:[{name:"Padr\xF5es e bandas",layout:"left",view:{w24:1,w5:1},html:`<div class="kicker">02 \xB7 Caracter\xEDsticas</div><h2>Dual band: duas redes ao mesmo tempo</h2>
        <div class="bands"><div class="b24"><b>2,4 GHz</b><span>802.11 b/g/n</span><em>at\xE9 300 Mbps</em></div><div class="b5"><b>5 GHz</b><span>802.11 a/n/ac</span><em>at\xE9 867 Mbps</em></div></div>
        <p>Padr\xE3o principal: <b>802.11ac (Wi-Fi 5)</b></p>`,say:"O Archer C6 \xE9 dual band: ele transmite em duas frequ\xEAncias ao mesmo tempo. Em laranja, a rede de 2,4 GHz, que usa os padr\xF5es b, g e n e chega a 300 megabits por segundo. Em azul, a de 5 GHz, com os padr\xF5es a, n e ac, que chega a 867 megabits. O padr\xE3o mais moderno dele \xE9 o 802.11ac, tamb\xE9m chamado de Wi-Fi 5.",notes:"2,4 GHz alcan\xE7a mais longe e atravessa melhor paredes; 5 GHz \xE9 mais r\xE1pido e menos congestionado, mas tem alcance menor."},{name:"De onde vem o 1200",layout:"left",view:{w24:1,w5:1},html:`<div class="kicker">02 \xB7 Caracter\xEDsticas</div><h2>De onde vem o \u201C1200\u201D</h2>
        <div class="sum"><span class="o">300</span> + <span class="c">867</span> = <b>\u2248 1200 Mbps</b></div>
        <p class="warn">Velocidade <b>nominal</b>: taxa m\xE1xima te\xF3rica do padr\xE3o IEEE 802.11. Na pr\xE1tica, dist\xE2ncia, paredes, interfer\xEAncia e o plano de internet reduzem bastante esse valor.</p>`,say:"O n\xFAmero 1200 vem da soma das duas bandas: 300 mais 867, aproximadamente 1200. Mas aten\xE7\xE3o: essa \xE9 a velocidade nominal, o m\xE1ximo te\xF3rico do padr\xE3o. Nenhum aparelho sozinho recebe 1200, e a velocidade real depende da dist\xE2ncia, das paredes, das interfer\xEAncias e, claro, do plano de internet contratado. Se o plano \xE9 de 200 mega, a internet n\xE3o passa de 200.",notes:"A pr\xF3pria TP-Link avisa que as taxas m\xE1ximas s\xE3o taxas f\xEDsicas derivadas das especifica\xE7\xF5es IEEE 802.11."},{name:"Antenas",layout:"left",view:{off:[-.26,0],cam:[-3.5,3.4,-5.5],target:[0,1.4,0],antGlow:1,w5:1},html:`<div class="kicker">02 \xB7 Caracter\xEDsticas</div><h2>5 antenas</h2>
        <ul class="big"><li><b>4 externas</b> fixas, omnidirecionais</li><li><b>1 interna</b>, dentro da carca\xE7a</li><li><b>MU-MIMO</b>: atende 2 dispositivos ao mesmo tempo</li><li><b>Beamforming</b>: direciona o sinal para o aparelho</li></ul>`,say:"Ele tem cinco antenas: quatro externas, essas que voc\xEAs veem acesas, e uma interna. Tamb\xE9m tem duas tecnologias importantes. MU-MIMO, que permite ao roteador conversar com at\xE9 dois aparelhos ao mesmo tempo em vez de um de cada vez. E beamforming, que concentra o sinal na dire\xE7\xE3o do dispositivo, em vez de espalhar igual para todo lado."},{name:"Seguran\xE7a",layout:"left",view:{cam:[0,4.2,9],target:[0,2.2,0],lock:1,antGlow:.4},html:`<div class="kicker">02 \xB7 Caracter\xEDsticas</div><h2>Seguran\xE7a</h2>
        <ul class="big"><li><b>WPA2-PSK</b> (recomendado) e WPA-PSK</li><li>WPA/WPA2-Enterprise</li><li>WEP 64/128 bits <small>(obsoleto, evitar)</small></li><li>Firewall SPI e prote\xE7\xE3o DoS</li><li>Rede de convidados separada</li></ul>`,say:"Na seguran\xE7a, o Wi-Fi \xE9 protegido por criptografia: os dados s\xE3o embaralhados com uma chave, e s\xF3 quem tem a senha consegue ler. O recomendado aqui \xE9 o WPA2. Ele ainda aceita WEP, mas esse \xE9 antigo e f\xE1cil de quebrar, ent\xE3o n\xE3o deve ser usado. Tamb\xE9m tem firewall, prote\xE7\xE3o contra ataques de nega\xE7\xE3o de servi\xE7o e uma rede de convidados, para visitas n\xE3o acessarem seus dispositivos.",cue:"Fim da Pessoa 1 \u2192 passe para a Pessoa 2.",notes:"Vers\xF5es mais novas do firmware de alguns modelos adicionaram WPA3; n\xE3o afirmamos isso para a V3."}]},{title:"Portas e hardware",who:Zu,time:"2:00",view:{cam:[0,2.2,-8],target:[0,.5,0],ry:0},steps:[{name:"Gira para a traseira",layout:"left",view:{cam:[-3,3,-8.5],target:[0,.5,0]},dur:2.4,html:'<div class="kicker">03 \xB7 Portas e hardware</div><h2>A parte de tr\xE1s</h2><p>Onde tudo se conecta.</p>',say:"Agora vamos para a parte de tr\xE1s do roteador, onde ficam as conex\xF5es."},{name:"Porta WAN",layout:"left",view:{off:[-.08,-.25],cam:[-1.9,1.7,-5.8],target:[-.6,.45,-1.4]},tags:["wan"],hl:["wan"],html:'<div class="kicker">03 \xB7 Portas</div><h2>Porta WAN <span class="pill blue">azul</span></h2><p>Entrada da internet. Liga no modem ou ONT da operadora.</p><p><b>Gigabit</b> \xB7 at\xE9 1000 Mbps</p>',say:"Esta \xE9 a porta WAN, a de cor azul. WAN significa rede de longa dist\xE2ncia: \xE9 por aqui que a internet entra. Ela \xE9 ligada com cabo ao modem ou \xE0 ONT da operadora. \xC9 Gigabit, aguenta at\xE9 1000 megabits."},{name:"Portas LAN",layout:"left",view:{off:[-.08,-.25],cam:[.5,1.7,-5.8],target:[.4,.45,-1.4]},tags:["lan"],hl:["lan"],html:'<div class="kicker">03 \xB7 Portas</div><h2>4 portas LAN <span class="pill amber">amarelas</span></h2><p>Rede local com cabo: PC, console, TV, impressora.</p><p><b>Gigabit</b> \xB7 conex\xE3o mais est\xE1vel que o Wi-Fi</p>',say:"Ao lado, as quatro portas LAN, de rede local. Servem para ligar com cabo computador, videogame, TV. Tamb\xE9m s\xE3o Gigabit. Cabo \xE9 sempre mais est\xE1vel que Wi-Fi, ent\xE3o para jogo online e chamada de v\xEDdeo \xE9 a melhor op\xE7\xE3o."},{name:"Bot\xF5es",layout:"left",view:{off:[-.08,-.25],cam:[0,2.3,-7.2],target:[0,.45,-1.4]},tags:["buttons","power"],hl:["buttons","jack"],html:`<div class="kicker">03 \xB7 Hardware</div><h2>Bot\xF5es</h2>
        <ul class="big"><li><b>Liga/Desliga</b> e entrada de energia</li><li><b>WPS/Wi-Fi</b>: conectar sem digitar senha</li><li><b>Reset</b>: embutido, volta \xE0s configura\xE7\xF5es de f\xE1brica</li></ul>`,say:"Tamb\xE9m temos os bot\xF5es. O liga e desliga, ao lado da entrada de energia. O bot\xE3o WPS, que permite conectar um aparelho apertando um bot\xE3o em vez de digitar a senha. E o Reset, que fica escondido dentro de um buraquinho, para ningu\xE9m apertar sem querer: segurando ele, o roteador volta \xE0s configura\xE7\xF5es de f\xE1brica."},{name:"LEDs",layout:"left",view:{off:[-.08,-.25],cam:[.8,1.9,6.4],target:[0,.5,1.4]},tags:["leds"],hl:["leds"],html:'<div class="kicker">03 \xB7 Hardware</div><h2>LEDs de status</h2><p>Na frente: energia, Wi-Fi 2,4 GHz, Wi-Fi 5 GHz, LAN, Internet e WPS.</p><p class="note">Clique nas pe\xE7as do modelo para ver explica\xE7\xF5es.</p>',pick:!0,say:"Na frente ficam os LEDs, as luzinhas de status. Eles mostram se o roteador est\xE1 ligado, se cada rede Wi-Fi est\xE1 ativa, se h\xE1 algo nas portas LAN, se a internet est\xE1 conectada e se o WPS est\xE1 em uso. Quando a internet cai, olhar o LED de internet \xE9 o primeiro passo para descobrir o problema.",notes:"Pode clicar no LED ou nas portas para mostrar o painel de explica\xE7\xE3o."},{name:"Por dentro",layout:"left",view:{cam:[3.5,6,6],target:[0,.9,0],explode:1},html:'<div class="kicker">03 \xB7 Hardware</div><h2>Por dentro (esquema)</h2><p>Placa com processador, r\xE1dios Wi-Fi e mem\xF3ria.</p><p class="note">Representa\xE7\xE3o <b>esquem\xE1tica</b> \u2014 n\xE3o \xE9 a placa real do Archer C6.</p>',say:"Por dentro, de forma simplificada, h\xE1 uma placa com o processador, os r\xE1dios Wi-Fi de cada banda e a mem\xF3ria. Isso que voc\xEAs veem \xE9 s\xF3 um esquema did\xE1tico, n\xE3o \xE9 foto da placa real.",cue:"Avance para os modos de funcionamento."}]},{title:"Fun\xE7\xF5es e modos",who:Zu,time:"2:00",view:{cam:[0,10.5,11.5],target:[0,0,0],s:.55},steps:[{name:"Modo roteador",layout:"top",view:{net:{nodes:[Jo,V_,Ju,$o,Ko],links:[["i","m","cable"],["m","r","cable"],["r","pc","cable"],["r","p1","wifi"],["r","p2","wifi"]]}},html:'<div class="kicker">04 \xB7 Modos</div><h2>Modo Roteador <span class="pill ok">suportado</span></h2><p>Recebe a internet do modem, cria a rede da casa, distribui IPs (DHCP) e protege com NAT/firewall.</p>',say:"O modo principal \xE9 o modo roteador. A internet chega pelo modem, entra na porta WAN, e o roteador cria a rede da casa: ele d\xE1 um endere\xE7o IP para cada aparelho, que \xE9 o DHCP, e separa a rede interna da internet, com NAT e firewall. \xC9 o modo de uso mais comum."},{name:"Modo ponto de acesso",layout:"top",view:{net:{nodes:[Jo,{id:"m",type:"router2",x:-4.2,z:.8,label:"Roteador existente"},$o,Ko,Ju],links:[["i","m","cable"],["m","r","cable"],["r","p1","wifi"],["r","p2","wifi"],["r","pc","cable"]]}},html:'<div class="kicker">04 \xB7 Modos</div><h2>Ponto de Acesso <span class="pill ok">suportado</span></h2><p>Ligado por cabo a um roteador que j\xE1 existe. S\xF3 adiciona Wi-Fi; quem controla a rede \xE9 o outro roteador.</p>',say:"O segundo modo \xE9 o ponto de acesso, ou Access Point. Aqui j\xE1 existe um roteador na casa, e o Archer C6 \xE9 ligado nele por cabo. Ele deixa de \u201Cmandar\u201D na rede e s\xF3 passa a criar Wi-Fi. \xC9 \xFAtil, por exemplo, para levar sinal para outro andar usando um cabo."},{name:"Modo repetidor",layout:"top",view:{net:{nodes:[Jo,{id:"m",type:"router2",x:-4.2,z:.8,label:"Roteador principal"},$o,Ko],links:[["i","m","cable"],["m","r","wifi"],["r","p1","wifi"],["r","p2","wifi"]]}},html:'<div class="kicker">04 \xB7 Modos</div><h2>Repetidor <span class="pill no">n\xE3o listado</span></h2><p>Captura o Wi-Fi de outro roteador e retransmite, sem cabo. A TP-Link <b>n\xE3o lista</b> esse modo para o Archer C6.</p>',say:"Repetidor \xE9 quando o aparelho pega o Wi-Fi de outro roteador, sem cabo, e repete o sinal mais longe. \xC9 importante dizer: a TP-Link n\xE3o lista o modo repetidor para o Archer C6. Os modos oficiais s\xE3o s\xF3 roteador e ponto de acesso. Para isso existem aparelhos pr\xF3prios, os repetidores, ou o sistema OneMesh, que o C6 suporta.",notes:"OneMesh: o C6 pode ser o roteador principal de uma rede OneMesh com extensores TP-Link compat\xEDveis."},{name:"WDS",layout:"top",view:{net:{nodes:[Jo,{id:"m",type:"router2",x:-4.2,z:.8,label:"Roteador A"},$o,Ko],links:[["i","m","cable"],["m","r","wds"],["r","p1","wifi"],["r","p2","wifi"]]}},html:'<div class="kicker">04 \xB7 Modos</div><h2>WDS <span class="pill warn">fun\xE7\xE3o do firmware</span></h2><p>Sistema de Distribui\xE7\xE3o Sem Fio: liga dois roteadores por Wi-Fi formando uma ponte. No C6 aparece como <b>WDS Bridging</b> nas configura\xE7\xF5es avan\xE7adas, e n\xE3o como modo de opera\xE7\xE3o.</p>',say:"Por \xFAltimo, o WDS, Sistema de Distribui\xE7\xE3o Sem Fio. Ele cria uma ponte sem fio entre dois roteadores, ent\xE3o os dois ficam na mesma rede. No Archer C6, isso n\xE3o aparece como modo de opera\xE7\xE3o, e sim como uma fun\xE7\xE3o chamada WDS Bridging, nas configura\xE7\xF5es avan\xE7adas. Funciona melhor quando os dois aparelhos s\xE3o compat\xEDveis.",cue:"Fim da Pessoa 2 \u2192 passe para a Pessoa 3.",notes:"Confirme no emulador oficial/no seu aparelho: Avan\xE7ado \u203A Ferramentas do Sistema \u203A Par\xE2metros do Sistema \u203A WDS Bridging."}]},{title:"Configura\xE7\xE3o",who:Ic,time:"2:00",view:{off:[-.15,.04],cam:[-5,3,7],target:[2.4,.6,0],x:-2.6,ry:.5},steps:[{name:"Acesso ao painel",layout:"right",html:`<div class="kicker">05 \xB7 Configura\xE7\xE3o</div><h2>Endere\xE7o de acesso</h2>
        <div class="url"><span>http://</span>tplinkwifi.net</div><div class="url alt"><span>ou </span>192.168.0.1</div>
        <p>Conecte-se ao roteador por cabo LAN ou Wi-Fi (nome e senha na etiqueta) e abra o endere\xE7o no navegador.</p>`,say:"Para configurar, primeiro voc\xEA se conecta ao roteador, por cabo ou pelo Wi-Fi. O nome da rede e a senha padr\xE3o est\xE3o na etiqueta embaixo dele. Depois abre o navegador e digita tplinkwifi.net ou o IP 192.168.0.1. Tamb\xE9m d\xE1 para configurar pelo aplicativo Tether, da TP-Link, no celular."},{name:"Passo a passo",layout:"right",html:`<div class="kicker">05 \xB7 Configura\xE7\xE3o</div><h2>Configura\xE7\xE3o b\xE1sica</h2>
        <ol class="steps"><li>Modem desligado \u2192 cabo at\xE9 a porta <b>WAN</b></li><li>Liga o modem e o roteador</li><li>Acessa <b>tplinkwifi.net</b></li><li>Cria a <b>senha de administrador</b></li><li><b>Quick Setup</b>: fuso, tipo de conex\xE3o, nome e senha do Wi-Fi</li><li>Salva e reconecta</li></ol>`,say:"O passo a passo b\xE1sico \xE9: com o modem desligado, liga o cabo dele na porta WAN. Liga o modem e o roteador. Acessa o endere\xE7o. No primeiro acesso, o roteador pede para criar uma senha de administrador, que protege o painel. Depois, o assistente de Configura\xE7\xE3o R\xE1pida pede o fuso hor\xE1rio, o tipo de conex\xE3o de internet, que a operadora informa, e o nome e a senha do Wi-Fi. Salva e pronto."},{name:"Telas do painel",layout:"full",view:{cam:[-9,4,10],target:[-3,.6,0],x:-5.5,s:.7},panel:`<div class="tabs"><div class="t active">Status / Rede</div><div class="t">Wireless</div><div class="t">Modo de opera\xE7\xE3o</div></div>
        <div class="screens">
          <figure><div class="mock"><h5>Rede \xB7 Status</h5><div class="row"><span>Internet</span><i class="okc">Conectado</i></div><div class="row"><span>IP WAN</span><i>din\xE2mico</i></div><div class="row"><span>Clientes</span><i>6</i></div></div><figcaption>Mapa da rede: estado da internet e aparelhos conectados</figcaption></figure>
          <figure><div class="mock"><h5>Wireless</h5><div class="row"><span>2,4 GHz</span><i>MinhaRede</i></div><div class="row"><span>5 GHz</span><i>MinhaRede_5G</i></div><div class="row"><span>Seguran\xE7a</span><i>WPA2-PSK</i></div></div><figcaption>Nome e senha das duas redes</figcaption></figure>
          <figure><div class="mock"><h5>Modo de opera\xE7\xE3o</h5><div class="row"><span>\u25C9 Roteador</span></div><div class="row"><span>\u25CB Ponto de acesso</span></div></div><figcaption>Troca entre roteador e AP</figcaption></figure>
        </div><p class="note">Representa\xE7\xF5es ilustrativas. Telas reais: emulador oficial em emulator.tp-link.com (Archer C6).</p>`,html:"",say:"Aqui est\xE3o as tr\xEAs telas mais importantes. A de status, que mostra se a internet est\xE1 conectada e quem est\xE1 usando a rede. A de Wireless, onde se troca o nome e a senha das redes 2,4 e 5 GHz. E a de modo de opera\xE7\xE3o, onde se escolhe entre roteador e ponto de acesso. Essas s\xE3o representa\xE7\xF5es; as telas reais podem ser vistas no emulador oficial da TP-Link.",notes:"Se tiver internet na hora, d\xE1 para mostrar o emulador oficial ao vivo. Se tirarem prints do emulador, substitua as representa\xE7\xF5es."}]},{title:"Pontos fortes e limita\xE7\xF5es",who:Ic,time:"2:00",view:{cam:[2.5,3.2,12],target:[2.5,.8,0],x:-1,ghost:1},steps:[{name:"Pontos fortes",layout:"left",view:{ghost:0,x:1.8,off:[-.02,0],cam:[0,3,10],target:[-1.2,.8,0],spin:1},html:'<div class="kicker">06 \xB7 Avalia\xE7\xE3o</div><h2>Pontos fortes</h2><ul class="big"><li>Portas <b>Gigabit</b> (WAN e LAN)</li><li>Dual band com <b>MU-MIMO</b> e beamforming</li><li>Configura\xE7\xE3o simples (web e app Tether)</li><li>Compat\xEDvel com <b>OneMesh</b></li><li>Pre\xE7o acess\xEDvel</li></ul>',say:"Os pontos fortes: todas as portas s\xE3o Gigabit, ent\xE3o n\xE3o limitam planos de internet comuns. \xC9 dual band, com MU-MIMO e beamforming. \xC9 f\xE1cil de configurar, pelo navegador ou pelo aplicativo. Aceita expans\xE3o com OneMesh. E \xE9 barato."},{name:"Limita\xE7\xF5es",layout:"left",view:{ghost:0,x:1.8,off:[-.02,0],cam:[0,3,10],target:[-1.2,.8,0],spin:1},html:'<div class="kicker">06 \xB7 Avalia\xE7\xE3o</div><h2>Limita\xE7\xF5es</h2><ul class="big"><li>Wi-Fi 5: sem <b>OFDMA</b> e sem 6 GHz</li><li>MU-MIMO limitado a 2 aparelhos</li><li>Sem porta USB</li><li>Desempenho cai com muitos aparelhos ao mesmo tempo</li><li>Sem modo repetidor oficial</li></ul>',say:"As limita\xE7\xF5es: ele \xE9 Wi-Fi 5, ent\xE3o n\xE3o tem as tecnologias do Wi-Fi 6, como o OFDMA, que divide melhor o canal entre muitos aparelhos. O MU-MIMO dele atende s\xF3 dois aparelhos por vez. N\xE3o tem porta USB. Em casas com muitos dispositivos ao mesmo tempo, o desempenho cai. E n\xE3o tem modo repetidor oficial."},{name:"Compara\xE7\xE3o",layout:"center-bottom",view:{ghost:1,x:-2.2,off:[.03,.2],cam:[2,3.4,13],target:[2.2,.8,0]},html:`<table class="cmp"><tr><th></th><th>Archer C6 \xB7 Wi-Fi 5</th><th>Wi-Fi 6 / 6E / 7</th></tr>
        <tr><td>Bandas</td><td>2,4 + 5 GHz</td><td>+ 6 GHz (6E/7)</td></tr>
        <tr><td>Muitos aparelhos</td><td>MU-MIMO (2)</td><td>OFDMA + MU-MIMO maior</td></tr>
        <tr><td>Seguran\xE7a</td><td>WPA2</td><td>WPA3 obrigat\xF3rio na certifica\xE7\xE3o Wi-Fi 6</td></tr>
        <tr><td>Uso ideal</td><td>Casa/apto pequeno, planos at\xE9 ~300 Mbps no Wi-Fi</td><td>Casas grandes, muitos dispositivos, planos altos</td></tr></table>`,say:"Comparando com os roteadores mais novos, de Wi-Fi 6, 6E e 7: eles lidam melhor com muitos aparelhos, por causa do OFDMA. Os de 6E e 7 t\xEAm uma terceira banda, de 6 GHz. E a certifica\xE7\xE3o Wi-Fi 6 exige WPA3, que \xE9 mais seguro."},{name:"Quando vale a pena",layout:"left",view:{ghost:0,x:1.8,off:[-.02,0],cam:[0,3,10],target:[-1.2,.8,0],spin:1},html:'<div class="kicker">06 \xB7 Avalia\xE7\xE3o</div><h2>Vale a pena quando\u2026</h2><ul class="big"><li>Casa ou apartamento pequeno/m\xE9dio</li><li>Poucos aparelhos ao mesmo tempo</li><li>Internet at\xE9 algumas centenas de megas</li><li>Or\xE7amento curto, ou para usar como ponto de acesso extra</li></ul>',say:"Ent\xE3o, vale a pena? Para uma casa ou apartamento pequeno ou m\xE9dio, com poucos aparelhos e plano de internet de at\xE9 algumas centenas de mega, sim: ele cumpre bem o papel e \xE9 barato. Para casa grande, muitos dispositivos ou plano de internet muito alto, um roteador Wi-Fi 6 \xE9 a melhor escolha."}]},{title:"Fontes",who:Ic,time:"1:00",view:{off:[0,-.32],cam:[0,3.4,14],target:[0,1.6,0],spin:1,y:-.2},steps:[{name:"Fontes",layout:"center",html:`<div class="kicker">07 \xB7 Fontes</div><h2>Fontes</h2><ul class="src">
